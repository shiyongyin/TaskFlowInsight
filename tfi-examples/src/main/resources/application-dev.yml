# Dev profile — 最小可运行配置（便于本地与 IT 验证）

tfi:
  annotation:
    enabled: true
  compare:
    enabled: true
    max-result-value-chars: 8192
    tracking:
      enabled: true

# 可选：提升可观测性（开发环境）
logging:
  level:
    com.syy.taskflowinsight: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: ["health","info"]
