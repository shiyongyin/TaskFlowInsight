# Prod profile — 保守默认（新功能关闭，可回滚）

tfi:
  annotation:
    enabled: false
  compare:
    enabled: false
    max-result-value-chars: 8192
    tracking:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: ["health","info"]

logging:
  level:
    com.syy.taskflowinsight: INFO
