name: tfi-flow-core CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'tfi-flow-core/**'
      - 'tfi-compare/**'
      - '.mvn/**'
      - 'config/pmd/**'
      - 'scripts/enforce_static_analysis_baseline.py'
      - 'pom.xml'
      - '.github/workflows/tfi-flow-core-ci.yml'
      - '.github/workflows/tfi-all-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tfi-flow-core/**'
      - 'tfi-compare/**'
      - '.mvn/**'
      - 'config/pmd/**'
      - 'scripts/enforce_static_analysis_baseline.py'
      - 'pom.xml'
      - '.github/workflows/tfi-flow-core-ci.yml'
      - '.github/workflows/tfi-all-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run unit tests + JaCoCo
        run: ./mvnw verify jacoco:report -pl tfi-flow-core -q

      - name: Compile JMH benchmarks
        run: ./mvnw -pl tfi-flow-core -Dtfi.perf.enabled=true test-compile -q

      - name: Compile all core consumers
        run: >-
          ./mvnw -pl
          tfi-flow-core,tfi-flow-spring-starter,tfi-compare,tfi-ops-spring,tfi-all,tfi-examples
          -am -DskipTests package -q

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfi-flow-core-jacoco-java${{ matrix.java }}
          path: tfi-flow-core/target/site/jacoco/
          retention-days: 14

  api-compat:
    name: API Compatibility
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify repository-owned API baseline checksums
        working-directory: .mvn/api-baseline
        run: sha256sum --check SHA256SUMS

      # Do not let setup-java's shared Maven cache masquerade as a published 3.0 baseline.
      - name: Verify core API compatibility against resolvable 3.0 baseline
        run: >-
          ./mvnw -pl tfi-flow-core -Papi-compat verify -DskipTests -q
          -Dmaven.repo.local=${{ runner.temp }}/tfi-api-baseline-m2

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: SpotBugs
        run: ./mvnw compile spotbugs:check -pl tfi-flow-core -q

      - name: Checkstyle
        if: ${{ !cancelled() }}
        run: ./mvnw checkstyle:check -pl tfi-flow-core -q

      - name: PMD
        if: ${{ !cancelled() }}
        run: ./mvnw pmd:check -pl tfi-flow-core -q

      - name: Enforce static analysis baseline
        run: >-
          python3 scripts/enforce_static_analysis_baseline.py
          --module tfi-flow-core

      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfi-flow-core-static-analysis-java21
          path: |
            tfi-flow-core/target/spotbugsXml.xml
            tfi-flow-core/target/checkstyle-result.xml
            tfi-flow-core/target/pmd.xml
          if-no-files-found: error
          retention-days: 14
