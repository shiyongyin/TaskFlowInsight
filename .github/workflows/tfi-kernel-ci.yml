name: tfi-kernel CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'tfi-kernel/**'
      - 'docs/adr/ADR-015-TFI-Kernel-Minimal-Execution-Foundation.md'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/tfi-kernel-ci.yml'
      - '.github/workflows/tfi-kernel-perf-gate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tfi-kernel/**'
      - 'docs/adr/ADR-015-TFI-Kernel-Minimal-Execution-Foundation.md'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/tfi-kernel-ci.yml'
      - '.github/workflows/tfi-kernel-perf-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify kernel quality gates
        run: ./mvnw -q -pl tfi-kernel -am verify

      - name: Run reactor regression
        run: ./mvnw -q test

      - name: Run plain Java example
        run: >-
          ./mvnw -q -pl tfi-kernel -DskipTests test-compile
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.mainClass=com.syy.tfi.kernel.example.PlainJavaKernelExample
          -Dexec.classpathScope=test

      - name: Compile JMH benchmarks
        run: >-
          ./mvnw -q -pl tfi-kernel -am -Pperf
          -Dtfi.perf.enabled=true -DskipTests test-compile

      - name: Generate report-only JMH evidence
        run: >-
          ./mvnw -q -pl tfi-kernel -am -Pperf
          -Dtfi.perf.enabled=true
          -Djacoco.skip=true
          -Dtest=KernelBenchmarkRunnerTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Build release-candidate artifacts
        run: ./mvnw -q -pl tfi-kernel -Prelease-artifacts -DskipTests package

      - name: Verify release-candidate artifact set
        run: |
          test -s tfi-kernel/target/tfi-kernel-*-sources.jar
          test -s tfi-kernel/target/tfi-kernel-*-javadoc.jar
          test -s tfi-kernel/target/flattened-pom.xml

      - name: Upload kernel jar
        uses: actions/upload-artifact@v4
        with:
          name: tfi-kernel-jar-java21
          path: |
            tfi-kernel/target/tfi-kernel-*.jar
            tfi-kernel/target/flattened-pom.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfi-kernel-quality-java21
          path: |
            tfi-kernel/target/site/jacoco/
            tfi-kernel/target/checkstyle-result.xml
            tfi-kernel/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JMH evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfi-kernel-jmh-java21
          path: |
            tfi-kernel/target/kernel-jmh-results.json
            tfi-kernel/target/kernel-jmh-gate.properties
          if-no-files-found: error
          retention-days: 14
