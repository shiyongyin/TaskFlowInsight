name: tfi-compare CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'tfi-flow-core/**'
      - 'tfi-compare/**'
      - 'tfi-compare-spring-starter/**'
      - 'tfi-ops-spring/**'
      - 'tfi-all/**'
      - 'tfi-examples/**'
      - '.mvn/api-baseline/**'
      - '.mvn/static-analysis-baseline.json'
      - 'config/pmd/**'
      - 'spotbugs-include.xml'
      - 'spotbugs-exclude.xml'
      - 'scripts/enforce_static_analysis_baseline.py'
      - 'scripts/prepare_tfi_compare_release_evidence.sh'
      - 'scripts/verify_tfi_compare_artifact_consumers.sh'
      - 'scripts/release-evidence/**'
      - '.gitignore'
      - 'pom.xml'
      - '.github/workflows/tfi-compare-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tfi-flow-core/**'
      - 'tfi-compare/**'
      - 'tfi-compare-spring-starter/**'
      - 'tfi-ops-spring/**'
      - 'tfi-all/**'
      - 'tfi-examples/**'
      - '.mvn/api-baseline/**'
      - '.mvn/static-analysis-baseline.json'
      - 'config/pmd/**'
      - 'spotbugs-include.xml'
      - 'spotbugs-exclude.xml'
      - 'scripts/enforce_static_analysis_baseline.py'
      - 'scripts/prepare_tfi_compare_release_evidence.sh'
      - 'scripts/verify_tfi_compare_artifact_consumers.sh'
      - 'scripts/release-evidence/**'
      - '.gitignore'
      - 'pom.xml'
      - '.github/workflows/tfi-compare-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install dependency modules
        run: ./mvnw install -pl tfi-flow-core -DskipTests -q

      - name: Run final module contracts
        run: >-
          ./mvnw -pl tfi-compare
          -Dtest=CompareArchitectureContractTests,CompareBuildConfigurationContractTests,CompareServiceLoaderContractTests,CompareDependencyBoundaryTests,CompareManifestCoverageTests,CompareResourceInventoryContractTests,CompareProjectionSchemaContractTests,CompareProjectionParityTests
          test -q

      - name: Run strict module verify
        run: ./mvnw -pl tfi-compare clean verify -q

      - name: Upload module quality reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tfi-compare-quality-java${{ matrix.java }}
          path: |
            tfi-compare/target/site/jacoco/
            tfi-compare/target/spotbugsXml.xml
            tfi-compare/target/checkstyle-result.xml
            tfi-compare/target/pmd.xml
          if-no-files-found: error
          retention-days: 14

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install dependency modules
        run: ./mvnw install -pl tfi-flow-core -DskipTests -q

      - name: OWASP Dependency-Check
        run: ./mvnw dependency-check:check -pl tfi-compare -q

      - name: Upload dependency-check report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-check-report
          path: |
            tfi-compare/target/dependency-check/dependency-check-report.html
            tfi-compare/target/dependency-check/dependency-check-report.json
          if-no-files-found: error
          retention-days: 14

  api-compat:
    name: API Compatibility
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install dependency modules
        run: ./mvnw install -pl tfi-flow-core -DskipTests -q

      - name: Verify fixed API baseline checksums
        working-directory: .mvn/api-baseline
        run: shasum -a 256 -c SHA256SUMS

      - name: Run API inventory and manifest contracts
        run: >-
          ./mvnw -pl tfi-compare
          -Dtest=CompareApiInventoryContractTests,CompareBreakingChangeManifestTests,CompareManifestCoverageTests,CompareResourceInventoryContractTests,CompareServiceLoaderContractTests,CompareArchitectureContractTests,CompareBuildConfigurationContractTests
          test -q

      - name: Run exact API compatibility check
        run: ./mvnw -pl tfi-compare -Papi-compat verify -DskipTests -q

  release-evidence-ci:
    name: Release Evidence CI
    runs-on: ubuntu-latest
    needs: [build-and-test, dependency-check, api-compat]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate fresh CI-only release evidence
        run: ./scripts/prepare_tfi_compare_release_evidence.sh --ci

      - name: Upload hidden release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tfi-compare-release-evidence
          path: '.evidence/ci/**'
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  evidence-integrity:
    name: Release Evidence Integrity
    runs-on: ubuntu-latest
    needs: release-evidence-ci
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'

      - name: Download hidden release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfi-compare-release-evidence
          path: .evidence/ci/

      - name: Verify downloaded evidence without rebuilding
        run: |
          mapfile -t markers < <(find .evidence/ci -type f -name CI_ONLY -print)
          test "${#markers[@]}" -eq 1
          evidence_dir="${markers[0]%/CI_ONLY}"
          java scripts/release-evidence/ReleaseEvidenceVerifier.java verify-integrity \
            "$evidence_dir" scripts/release-evidence/expected-reports.tsv
