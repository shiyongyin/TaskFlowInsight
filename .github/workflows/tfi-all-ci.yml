name: tfi-all CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'tfi-all/**'
      - 'tfi-flow-core/**'
      - 'tfi-compare/**'
      - '.mvn/**'
      - 'config/pmd/**'
      - 'scripts/enforce_static_analysis_baseline.py'
      - 'pom.xml'
      - '.github/workflows/tfi-flow-core-ci.yml'
      - '.github/workflows/tfi-all-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tfi-all/**'
      - 'tfi-flow-core/**'
      - 'tfi-compare/**'
      - '.mvn/**'
      - 'config/pmd/**'
      - 'scripts/enforce_static_analysis_baseline.py'
      - 'pom.xml'
      - '.github/workflows/tfi-flow-core-ci.yml'
      - '.github/workflows/tfi-all-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install dependency modules
        run: ./mvnw install -pl tfi-flow-core,tfi-flow-spring-starter,tfi-compare,tfi-ops-spring -am -DskipTests -q

      - name: Run unit tests + JaCoCo
        run: ./mvnw verify jacoco:report -pl tfi-all -q

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfi-all-jacoco-java${{ matrix.java }}
          path: tfi-all/target/site/jacoco/
          retention-days: 14

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install dependency modules
        run: ./mvnw install -pl tfi-flow-core,tfi-flow-spring-starter,tfi-compare,tfi-ops-spring -am -DskipTests -q

      - name: SpotBugs
        run: ./mvnw compile spotbugs:check -pl tfi-all -q

      - name: Generate Checkstyle and PMD reports
        run: >-
          ./mvnw checkstyle:check pmd:check -pl tfi-all -q
          -Dcheckstyle.consoleOutput=false -Dpmd.printFailingErrors=false

      - name: Enforce static analysis baseline
        run: >-
          python3 scripts/enforce_static_analysis_baseline.py
          --module tfi-all

      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfi-all-static-analysis-java21
          path: |
            tfi-all/target/spotbugsXml.xml
            tfi-all/target/checkstyle-result.xml
            tfi-all/target/pmd.xml
          if-no-files-found: error
          retention-days: 14

  api-compat:
    name: API Compatibility
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify repository-owned API baseline checksums
        working-directory: .mvn/api-baseline
        run: sha256sum --check SHA256SUMS

      - name: Install dependency modules
        run: >-
          ./mvnw install
          -pl tfi-flow-core,tfi-flow-spring-starter,tfi-compare,tfi-ops-spring
          -am -DskipTests -q
          -Dmaven.repo.local=${{ runner.temp }}/tfi-api-baseline-m2

      - name: Run API compatibility check (japicmp)
        run: >-
          ./mvnw verify -pl tfi-all -Papi-compat -DskipTests -q
          -Dmaven.repo.local=${{ runner.temp }}/tfi-api-baseline-m2
